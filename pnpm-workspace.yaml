packages:
  - packages/@novel-segment/*
  # all packages in subdirs of packages/ and components/
  - packages/*
  # exclude packages that are inside test/ directories
  - '!**/test/**'
  # publicHoistPattern:
  # - "@lazy-cjk/*"
  # - "@node-novel/*"
  # - "@novel-segment/*"
  # - "novel-segment*"
  # - "workspace:segment-dict"
  # - "ts-type"
  # - "yargs"
  # - "@bluelovers/jest-config"
  # - "@bluelovers/string-natural-compare"

linkWorkspacePackages: true
saveWorkspaceProtocol: false
#  設定決定了 當依賴版本重疊時，pnpm 該優先用「本地程式碼」還是「線上版本」。
preferWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@types/node@26.5.0'
  - '@lazy-num/sum@3.0.0'
  - '@lazy-random/df-sum@3.0.0'
  - '@lazy-random/distributions@4.0.0'
  - '@lazy-random/preset-seedrandom@3.0.0'
  - '@lazy-random/random-core@4.0.0'
  - random-extra@7.0.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lib-r-math.js: true
  unrs-resolver: true
  core-js-pure: true
  nx: true
